<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lum’Asar — Язык Света</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 20px;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #4a90e2;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .syllable-buttons {
      margin-bottom: 20px;
    }
    .syllable-buttons button {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .syllable-buttons button:hover {
      background-color: #43a047;
    }
    .mantra-display {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    .mantra-display h2 {
      margin-top: 0;
    }
    .mantra-display p {
      font-size: 18px;
    }
    .reset-button {
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .reset-button:hover {
      background-color: #e64a19;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lum’Asar — Язык Света</h1>
    <p>Составь свою мантру, выбрав до трёх слогов:</p>

    <div class="syllable-buttons">
      <button onclick="addSyllable('Lu')">Lu (Свет)</button>
      <button onclick="addSyllable('Sa')">Sa (Любовь)</button>
      <button onclick="addSyllable('Ra')">Ra (Сила)</button>
      <button onclick="addSyllable('Va')">Va (Гармония)</button>
      <button onclick="addSyllable('Mi')">Mi (Истина)</button>
      <button onclick="addSyllable('Ke')">Ke (Вечность)</button>
    </div>

    <div class="mantra-display">
      <h2>Твоя мантра:</h2>
      <p id="mantra-formula">Формула: </p>
      <p id="mantra-meaning">Значение: </p>
    </div>

    <button class="reset-button" onclick="resetMantra()">Сбросить мантру</button>
  </div>

  <script>
    const syllables = {
      "Lu": "Свет, начало, рождение",
      "Sa": "Любовь, связь, поток",
      "Ra": "Сила, освобождение, воля",
      "Va": "Гармония, рост, развитие",
      "Mi": "Истина, вдохновение, прояснение",
      "Ke": "Вечность, целостность, тишина"
    };

    let selectedSyllables = [];

    function addSyllable(syllable) {
      if (selectedSyllables.length < 3) {
        selectedSyllables.push(syllable);
        updateMantra();
      } else {
        alert("Ты можешь выбрать не более 3 слогов.");
      }
    }

    function updateMantra() {
      const formulaDisplay = document.getElementById('mantra-formula');
      const meaningDisplay = document.getElementById('mantra-meaning');

      const formula = selectedSyllables.join('-');
      const meaning = selectedSyllables.map(s => syllables[s]).join(' + ');

      formulaDisplay.textContent = `Формула: ${formula}`;
      meaningDisplay.textContent = `Значение: ${meaning}`;
    }

    function resetMantra() {
      selectedSyllables = [];
      updateMantra();
    }
  </script>
</body>
</html>
